name: Release

# Publica uma versão quando uma tag vX.Y.Z é enviada (git tag v0.1.0 && git push origin v0.1.0).
# Compila o DataBox otimizado para Windows e para Linux e cria a página da versão com o DataBox.exe, um .zip para
# Windows (exe, licença e avisos de terceiros), um .tar.gz para Linux (o binário, a licença e os avisos) e o SHA-256.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-msvcrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r3.zip

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust (toolchain GNU)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: MinGW (WinLibs)
        run: |
          $destino = "$env:LOCALAPPDATA\Programs\winlibs-gcc16"
          New-Item -ItemType Directory -Force $destino | Out-Null
          Invoke-WebRequest -UseBasicParsing $env:WINLIBS_URL -OutFile "$env:RUNNER_TEMP\winlibs.zip"
          tar -xf "$env:RUNNER_TEMP\winlibs.zip" -C $destino

      - name: Conferir a versão
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $versao = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $versao) { throw "A tag (v$tag) não bate com a versão do Cargo.toml ($versao)." }

      - name: Compilar
        run: ./cargo.ps1 build --release -p editor

      - name: Empacotar
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force pacote, saida | Out-Null
          Copy-Item target\release\DataBox.exe pacote\DataBox.exe
          Copy-Item LICENSE pacote\LICENSE.txt
          # os avisos de terceiros que o build.rs do editor gerou (a lista, as fontes do egui e os textos de licença)
          $avisos = Get-ChildItem target\release\build\editor-*\out\THIRD-PARTY-NOTICES.txt |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $avisos) { throw "O build não gerou o THIRD-PARTY-NOTICES.txt." }
          Copy-Item $avisos.FullName pacote\THIRD-PARTY-NOTICES.txt
          Compress-Archive -Path pacote\* -DestinationPath "saida\DataBox-$tag-windows-x64.zip"
          Copy-Item target\release\DataBox.exe saida\DataBox.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: saida/*

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pacotes do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Compilar
        run: cargo build --release -p editor

      - name: Empacotar
        run: |
          tag="${{ github.ref_name }}"
          nome="DataBox-$tag-linux-x64"
          mkdir -p "$nome" saida
          cp target/release/DataBox "$nome/DataBox"
          cp LICENSE "$nome/LICENSE.txt"
          avisos=$(ls -t target/release/build/editor-*/out/THIRD-PARTY-NOTICES.txt 2>/dev/null | head -n 1)
          if [ -z "$avisos" ]; then echo "O build não gerou o THIRD-PARTY-NOTICES.txt."; exit 1; fi
          cp "$avisos" "$nome/THIRD-PARTY-NOTICES.txt"
          tar -czf "saida/$nome.tar.gz" "$nome"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: saida/*

  publicar:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true

      - name: Criar a versão no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          cd arquivos
          sha256sum DataBox.exe "DataBox-$tag-windows-x64.zip" "DataBox-$tag-linux-x64.tar.gz" > SHA256SUMS.txt
          notas="Veja o [CHANGELOG](https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md)."
          gh release create "$tag" DataBox.exe "DataBox-$tag-windows-x64.zip" "DataBox-$tag-linux-x64.tar.gz" \
            SHA256SUMS.txt --title "DataBox $tag" --notes "$notas" --verify-tag --repo "${{ github.repository }}"
