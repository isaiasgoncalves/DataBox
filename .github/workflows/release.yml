name: Release

# Publica uma versão quando uma tag vX.Y.Z é enviada (git tag v0.1.0 && git push origin v0.1.0).
# Compila o DataBox.exe otimizado e cria a página da versão com o executável, um .zip e o SHA-256.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-msvcrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r3.zip

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust (toolchain GNU)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: MinGW (WinLibs)
        run: |
          $destino = "$env:LOCALAPPDATA\Programs\winlibs-gcc16"
          New-Item -ItemType Directory -Force $destino | Out-Null
          Invoke-WebRequest -UseBasicParsing $env:WINLIBS_URL -OutFile "$env:RUNNER_TEMP\winlibs.zip"
          tar -xf "$env:RUNNER_TEMP\winlibs.zip" -C $destino

      - name: Conferir a versão
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $versao = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $versao) { throw "A tag (v$tag) não bate com a versão do Cargo.toml ($versao)." }

      - name: Compilar
        run: ./cargo.ps1 build --release -p editor

      - name: Empacotar
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force pacote | Out-Null
          Copy-Item target\release\DataBox.exe pacote\DataBox.exe
          Copy-Item LICENSE pacote\LICENSE.txt
          Compress-Archive -Path pacote\* -DestinationPath "DataBox-$tag-windows-x64.zip"
          Copy-Item target\release\DataBox.exe DataBox.exe
          Get-FileHash DataBox.exe, "DataBox-$tag-windows-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Criar a versão no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notas = "Veja o [CHANGELOG](https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md)."
          gh release create $tag DataBox.exe "DataBox-$tag-windows-x64.zip" SHA256SUMS.txt `
            --title "DataBox $tag" --notes $notas --verify-tag
