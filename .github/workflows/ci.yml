name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rodar à mão (Actions › CI › Run workflow) também monta o AppImage, para testar antes de publicar uma versão.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-msvcrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r3.zip

jobs:
  testar:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust (toolchain GNU)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal -c clippy -c rustfmt
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV

      - name: Cache do MinGW (WinLibs)
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Programs\winlibs-gcc16
          key: winlibs-${{ env.WINLIBS_URL }}

      - name: MinGW (WinLibs)
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        run: |
          $destino = "$env:LOCALAPPDATA\Programs\winlibs-gcc16"
          New-Item -ItemType Directory -Force $destino | Out-Null
          Invoke-WebRequest -UseBasicParsing $env:WINLIBS_URL -OutFile "$env:RUNNER_TEMP\winlibs.zip"
          tar -xf "$env:RUNNER_TEMP\winlibs.zip" -C $destino

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Formatação
        run: ./cargo.ps1 fmt --all '--' --check

      - name: Clippy
        run: ./cargo.ps1 clippy --workspace --all-targets '--' -D warnings

      # O renderizador de software do Windows (WARP) cai com STATUS_ACCESS_VIOLATION quando vários testes criam o wgpu
      # ao mesmo tempo. Os testes de tela (egui_kittest com wgpu) moram nos crates editor, interface e tela_*, inclusive
      # testes de unidade (editor/src/tabela.rs, tela_esquema/src/testes): o corte é por crate, não por alvo. O resto
      # roda em paralelo; as telas, numa thread só. Sem repetição: teste que cair duas vezes por ambiente vira
      # #[ignore] com issue aberta.
      - name: Testes de núcleo
        run: ./cargo.ps1 test --workspace --exclude editor --exclude interface --exclude 'tela_*' --no-fail-fast

      - name: Testes de tela
        run: ./cargo.ps1 test -p editor -p interface -p 'tela_*' --no-fail-fast '--' --test-threads=1

      - name: Testes do editor sem as telas
        run: ./cargo.ps1 test -p editor --no-default-features '--' --test-threads=1

  linux:
    # O porte para Linux: o mesmo fmt, clippy e testes, com o cargo direto (o cargo.ps1 e o intermediário de link
    # são só do Windows). Os testes de tela renderizam com o lavapipe (Vulkan por software do Mesa), que aguenta o
    # paralelo; o Linux é a referência das capturas.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pacotes do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            mesa-vulkan-drivers fonts-noto-core fonts-dejavu-core xdg-utils

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal -c clippy -c rustfmt
          rustup default stable
          rustc -vV

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-

      - name: Formatação
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace --no-fail-fast

      - name: Testes do editor sem as telas
        run: cargo test -p editor --no-default-features

  appimage:
    # Só quando rodado à mão: o AppImage do commit escolhido, como artefato (Actions › a execução › Artifacts).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pacotes do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: AppImage
        run: bash ferramentas/appimage.sh "dev-${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
